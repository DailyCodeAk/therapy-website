<div class="auth-modal-overlay" id="loginModal">
    <div class="auth-modal-container">
        <button class="auth-modal-close" id="closeLoginModal">✕</button>
        <h3 class="auth-modal-title">Sign In</h3>

        <form id="loginForm">
            <div class="auth-form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="auth-form-control" required>
                <div class="auth-error" id="loginEmailError">Please enter a valid email address</div>
            </div>

            <div class="auth-form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="auth-form-control" required>
                <div class="auth-error" id="loginPasswordError">Password must be at least 6 characters</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>

            <div class="auth-error" id="loginGeneralError" style="text-align: center; margin-top: 1rem; display: none;">Invalid email or password</div>
        </form>

        <div class="auth-or-divider">
            <span>OR</span>
        </div>

        <div class="auth-social-buttons">
            <button class="auth-social-btn">
                <span>Google</span>
            </button>
            <button class="auth-social-btn">
                <span>Facebook</span>
            </button>
        </div>

        <div class="auth-form-footer">
            Don't have an account? <a id="showRegisterBtn">Sign up</a>
        </div>
    </div>
</div>
